<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payoo | pay</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md mx-auto">
    <div class="w-[200px] mx-auto mt-32">
        <img src="assets/Logo-full.png" alt="">
    </div>
    <div class="card bg-base-100 w-full max-w-sm mx-auto mt-3 shrink-0 shadow-2xl">
        <div class="card-body">
            <fieldset class="fieldset">
                <label class="label text-[16px] text-black">Mobile number</label>
                <input id="number" type="number" class="input py-3 rounded-2xl" placeholder="Enter your number" />
                <label class="label text-[16px] text-black mt-3">4 Digit pin</label>
                <input id="pin" type="password" maxlength="4" class="input py-3 rounded-2xl" placeholder="Give pin" />
                <button id="loginBtn" class="btn btn-primary rounded-full mt-4">Login</button>
            </fieldset>
        </div>
    </div>
</body>




<script src="script/login.js"></script>

</html>
